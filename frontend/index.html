<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FloodAI — Flood Prediction & Alert System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/glass.css" />
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/chart.umd.js"></script>
<!-- Firebase Web SDK for Web Push Messaging & Google Auth -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<style>
:root{
  --bg-0:#060B18; --bg-1:#0A1120; --bg-2:#0D1626;
  --panel: rgba(255,255,255,0.045); --panel-strong: rgba(255,255,255,0.07);
  --panel-border: rgba(255,255,255,0.09);
  --cyber: var(--accent-primary, #33C7FF); 
  --ocean: var(--accent-secondary, #1FE0A8); 
  --purple: var(--accent-tertiary, #B18CFF);
  --red:#FF4D6A; --amber:#FFB84D;
  --text-0:#EAF2FF; --text-1:#93A4C3; --text-2:#5D6C8A;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  --radius:16px;
}
html.light{
  --bg-0:#F1F5FB; --bg-1:#FFFFFF; --bg-2:#E9EEF7;
  --panel: rgba(10,20,45,0.035); --panel-strong: rgba(10,20,45,0.06);
  --panel-border: rgba(10,20,45,0.10);
  --text-0:#0B1526; --text-1:#4A5875; --text-2:#7C8AA8;
}
html{ overflow-x:clip; scroll-behavior:smooth; }
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background: radial-gradient(ellipse 90% 60% at 20% -10%, var(--accent-glow, rgba(51,199,255,0.12)), transparent 55%),
              radial-gradient(ellipse 80% 50% at 90% 0%, rgba(177,140,255,0.10), transparent 55%),
              var(--bg-0);
  color:var(--text-0); font-family:var(--font-body); min-height:100vh; overflow-x:clip;
  transition: background .4s ease, color .4s ease;
}
::selection{ background:var(--cyber); color:#04101f; }
a{ color:inherit; text-decoration:none; }

.glass{
  background:var(--panel); border:1px solid var(--panel-border);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-radius: var(--radius);
}

/* ---------- Nav ---------- */
header.topbar{
  position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between;
  padding:14px 28px; backdrop-filter: blur(16px); background:rgba(6,11,24,0.55);
  border-bottom:1px solid var(--panel-border);
}
html.light header.topbar{ background:rgba(255,255,255,0.7); }
.brand{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:.2px;}
.brand .mark{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
  background:conic-gradient(from 180deg, var(--cyber), var(--ocean), var(--purple), var(--cyber)); box-shadow:0 0 22px rgba(51,199,255,.45);}
.brand .mark svg{ width:18px; height:18px; }
nav.tabs{ display:flex; gap:4px; flex-wrap:wrap; }
nav.tabs button{
  background:transparent; border:1px solid transparent; color:var(--text-1); font-family:var(--font-body);
  font-size:13.5px; font-weight:600; padding:8px 14px; border-radius:10px; cursor:pointer; transition:.25s;
}
nav.tabs button:hover{ color:var(--text-0); background:var(--panel); }
nav.tabs button.active{ color:var(--bg-0); background:linear-gradient(135deg, var(--cyber), var(--ocean)); }
.top-actions{ display:flex; align-items:center; gap:10px; }
.icon-btn{ width:38px; height:38px; border-radius:10px; display:grid; place-items:center; cursor:pointer;
  background:var(--panel); border:1px solid var(--panel-border); color:var(--text-0); transition:.2s;}
.icon-btn:hover{ border-color:var(--cyber); color:var(--cyber); }
.mobile-toggle{ display:none; }

/* ---------- Command Palette (Ctrl+K) ---------- */
.cmd-palette-trigger {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  color: var(--text-1);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.25s ease;
  min-width: 260px;
  max-width: 380px;
}
.cmd-palette-trigger:hover {
  border-color: var(--cyber);
  color: var(--text-0);
  background: var(--panel-strong);
  box-shadow: 0 0 16px rgba(51, 199, 255, 0.15);
}
.cmd-placeholder-text {
  flex: 1;
  text-align: left;
}
.cmd-kbd-shortcut {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 2px 6px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--panel-border);
  color: var(--text-2);
}
html.light .cmd-kbd-shortcut {
  background: rgba(0, 0, 0, 0.06);
}

.cmd-palette-card {
  width: 100%;
  max-width: 620px;
  background: rgba(10, 17, 32, 0.94);
  backdrop-filter: blur(24px);
  border: 1px solid var(--panel-border);
  border-radius: 18px;
  padding: 0;
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(51, 199, 255, 0.2);
  animation: cmdScaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
html.light .cmd-palette-card {
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 24px 64px rgba(10, 20, 45, 0.25), 0 0 0 1px rgba(51, 199, 255, 0.3);
}
@keyframes cmdScaleIn {
  from { opacity: 0; transform: scale(0.96) translateY(-10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.cmd-palette-search-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--panel-border);
}
.cmd-palette-search-wrap input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--text-0);
}
.cmd-palette-results {
  max-height: 380px;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.cmd-palette-section-title {
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-2);
  padding: 8px 12px 4px;
}
.cmd-palette-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid transparent;
}
.cmd-palette-item:hover, .cmd-palette-item.active {
  background: rgba(51, 199, 255, 0.12);
  border-color: rgba(51, 199, 255, 0.3);
}
.cmd-palette-item-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.cmd-palette-item-icon {
  font-size: 18px;
  width: 28px;
  display: grid;
  place-items: center;
}
.cmd-palette-item-title {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-0);
}
.cmd-palette-item-sub {
  font-size: 11.5px;
  color: var(--text-2);
  margin-top: 2px;
}
.cmd-palette-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 14px;
  padding: 10px 20px;
  border-top: 1px solid var(--panel-border);
  font-size: 11px;
  color: var(--text-2);
  background: rgba(0, 0, 0, 0.15);
}
.cmd-palette-footer kbd {
  font-family: var(--font-mono);
  padding: 2px 5px;
  border-radius: 4px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  color: var(--text-1);
}

/* ---------- Mobile Drawer Menu ---------- */
.mobile-menu-btn {
  display: none;
  font-size: 18px;
}
@media (max-width: 980px) {
  .mobile-menu-btn { display: grid; }
  .cmd-palette-trigger { max-width: 220px; }
}
@media (max-width: 640px) {
  .cmd-palette-trigger { min-width: auto; padding: 8px 12px; }
  .cmd-placeholder-text { display: none; }
  .cmd-kbd-shortcut { display: none; }
}

.mobile-drawer-overlay {
  position: fixed;
  inset: 0;
  z-index: 250;
  background: rgba(4, 8, 18, 0.7);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.mobile-drawer-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.mobile-drawer-content {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 82%;
  max-width: 340px;
  background: rgba(10, 17, 32, 0.96);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  padding: 20px;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 12px 0 36px rgba(0, 0, 0, 0.5);
  overflow-y: auto;
}
html.light .mobile-drawer-content {
  background: rgba(255, 255, 255, 0.98);
}
.mobile-drawer-overlay.open .mobile-drawer-content {
  transform: translateX(0);
}
.mobile-drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--panel-border);
}
.mobile-drawer-user {
  padding: 14px 0;
  border-bottom: 1px solid var(--panel-border);
}
.mobile-drawer-nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 16px 0;
  flex: 1;
}
.mobile-drawer-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 10px;
  color: var(--text-1);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}
.mobile-drawer-item:hover, .mobile-drawer-item.active {
  background: rgba(51, 199, 255, 0.12);
  color: var(--cyber);
}
.mobile-drawer-actions {
  padding-top: 14px;
  border-top: 1px solid var(--panel-border);
}

/* ---------- Page shell & Cinematic Transitions ---------- */
main{ max-width:1280px; margin:0 auto; padding:28px 24px 80px; min-height:60vh; }
.page{ 
  display:none; 
  opacity:0; 
  transform:translateY(14px) scale(0.995); 
  filter:blur(3px); 
  transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
}
.page.active{ 
  display:block; 
  opacity:1; 
  transform:translateY(0) scale(1); 
  filter:blur(0);
}
.page.page-exit{
  opacity:0 !important;
  transform:translateY(-8px) scale(0.995) !important;
  filter:blur(3px) !important;
  transition: opacity 0.16s ease-in, transform 0.16s ease-in, filter 0.16s ease-in !important;
}

.eyebrow{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--ocean); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.eyebrow::before{ content:''; width:7px; height:7px; border-radius:50%; background:var(--ocean); box-shadow:0 0 10px var(--ocean); }
h1.page-title{ font-family:var(--font-display); font-size:38px; font-weight:700; line-height:1.15; margin-bottom:10px;}
p.page-sub{ color:var(--text-1); font-size:15px; max-width:640px; line-height:1.6; }

/* ---------- Hero ---------- */
.hero{ display:grid; grid-template-columns: 1.1fr 0.9fr; gap:40px; align-items:center; padding:36px 0 10px;}
.hero h1{ font-family:var(--font-display); font-size:54px; line-height:1.05; font-weight:700; margin-bottom:18px; }
.hero h1 .grad{ background:linear-gradient(100deg, var(--cyber), var(--ocean) 60%, var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero p{ color:var(--text-1); font-size:16px; line-height:1.7; max-width:520px; margin-bottom:26px;}
.btn-row{ display:flex; gap:12px; flex-wrap:wrap; }
.btn{ font-family:var(--font-body); font-weight:600; font-size:14px; padding:13px 22px; border-radius:12px; cursor:pointer; border:1px solid transparent; transition:.25s; display:inline-flex; align-items:center; gap:8px;}
.btn-sm{ padding:8px 14px; font-size:12.5px; border-radius:9px; }
.btn-primary{ background:linear-gradient(135deg, var(--cyber), var(--ocean)); color:#03101f; box-shadow:0 8px 30px -8px rgba(51,199,255,.55);}
.btn-primary:hover{ transform:translateY(-2px); box-shadow:0 12px 34px -6px rgba(51,199,255,.65);}
.btn-ghost{ background:var(--panel); border-color:var(--panel-border); color:var(--text-0);}
.btn-ghost:hover{ border-color:var(--cyber); color:var(--cyber); }
.btn-danger{ background:rgba(255,77,106,0.15); border-color:rgba(255,77,106,0.4); color:var(--red); }
.btn-danger:hover{ background:rgba(255,77,106,0.25); border-color:var(--red); }

/* Signature radar gauge */
.radar-wrap{ display:flex; align-items:center; justify-content:center; position:relative; }
.radar-card{ padding:26px; text-align:center; width:100%; max-width:360px; position:relative; }
.radar-card .tag{ font-family:var(--font-mono); font-size:11px; color:var(--text-2); letter-spacing:1.5px; text-transform:uppercase;}
.radar-svg{ width:100%; height:auto; }
.radar-scan{ transform-origin:200px 200px; animation:spin 4s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg);} }
.radar-value{ font-family:var(--font-display); font-size:44px; font-weight:700; }
.radar-label{ font-family:var(--font-mono); font-size:12px; letter-spacing:2px; text-transform:uppercase; }

/* ---------- stat strip ---------- */
.stat-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:44px 0; }
.stat-card{ padding:20px; }
.stat-card .num{ font-family:var(--font-display); font-size:30px; font-weight:700; }
.stat-card .lbl{ color:var(--text-1); font-size:12.5px; margin-top:4px; }
.stat-card .delta{ font-family:var(--font-mono); font-size:11px; margin-top:8px; }
.up{ color:var(--ocean); } .down{ color:var(--red); }

/* quick access */
.grid-cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:14px;}
.qcard{ padding:22px; cursor:pointer; transition:.25s; position:relative; overflow:hidden;}
.qcard:hover{ transform:translateY(-4px); border-color:var(--cyber); box-shadow:0 12px 30px -10px rgba(51,199,255,0.25); }
.qcard .qi{ width:40px; height:40px; border-radius:11px; display:grid; place-items:center; margin-bottom:14px;
  background:rgba(51,199,255,.12); color:var(--cyber);}
.qcard h3{ font-family:var(--font-display); font-size:16px; margin-bottom:5px;}
.qcard p{ color:var(--text-1); font-size:12.5px; line-height:1.5;}

section.block{ margin-top:64px; }
.block-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
h2.block-title{ font-family:var(--font-display); font-size:24px; font-weight:700;}

/* Alert banner */
.alert-banner{ display:flex; align-items:center; gap:14px; padding:14px 20px; border-radius:14px; margin-bottom:28px;
  background:linear-gradient(90deg, rgba(255,77,106,.14), rgba(255,184,77,.08)); border:1px solid rgba(255,77,106,.35);}
.alert-dot{ width:10px; height:10px; border-radius:50%; background:var(--red); box-shadow:0 0 12px var(--red); flex-shrink:0; animation:pulse 1.6s infinite;}
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.alert-banner b{ font-family:var(--font-display); }
.alert-banner span{ color:var(--text-1); font-size:13px; }

/* ---------- Forms (predict page) ---------- */
.predict-layout{ display:grid; grid-template-columns:1.15fr 0.85fr; gap:24px; align-items:start; margin-top:22px;}
.form-panel{ padding:26px; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.field{ display:flex; flex-direction:column; gap:6px; }
.field.span2{ grid-column:1/-1; }
.field label{ font-size:12px; color:var(--text-1); font-weight:600; display:flex; justify-content:space-between; }
.field label .valtag{ font-family:var(--font-mono); color:var(--cyber); }
.field input[type=range]{ accent-color:var(--cyber); }
.field select, .field input[type=text], .field input[type=number], .field input[type=email], .field input[type=password], .field textarea{
  background:var(--bg-1); border:1px solid var(--panel-border); border-radius:10px; padding:10px 12px; color:var(--text-0);
  font-family:var(--font-body); font-size:13.5px;
}
.field select:focus, .field input:focus, .field textarea:focus{ outline:none; border-color:var(--cyber); }
.toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:var(--bg-1); border:1px solid var(--panel-border); border-radius:10px;}
.switch{ width:42px; height:24px; border-radius:20px; background:var(--panel-border); position:relative; cursor:pointer; transition:.2s;}
.switch.on{ background:var(--ocean); }
.switch i{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s;}
.switch.on i{ left:20px; }

.result-panel{ padding:26px; position:sticky; top:90px; }
.gauge-wrap{ display:flex; flex-direction:column; align-items:center; padding:8px 0 4px;}
.risk-pill{ display:inline-block; padding:6px 16px; border-radius:20px; font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:1px; margin-top:10px;}
.factors{ margin-top:22px; }
.factor-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
.factor-row .fname{ width:120px; color:var(--text-1); flex-shrink:0;}
.factor-bar{ flex:1; height:7px; border-radius:6px; background:var(--bg-1); overflow:hidden;}
.factor-bar i{ display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--cyber),var(--ocean));}
.factor-row .fval{ font-family:var(--font-mono); color:var(--text-2); width:40px; text-align:right;}
.recommend{ margin-top:20px; padding:14px; border-radius:12px; background:var(--bg-1); border:1px solid var(--panel-border); font-size:13px; color:var(--text-1); line-height:1.6;}

/* ---------- Map ---------- */
#map{ height:560px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--panel-border); }
.map-layout{ display:grid; grid-template-columns: 1fr 320px; gap:18px; margin-top:18px;}
.map-legend{ padding:20px; display:flex; flex-direction:column; gap:14px; }
.leg-item{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-1);}
.leg-dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0;}

/* ---------- charts ---------- */
.chart-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px;}
.chart-card{ padding:20px; }
.chart-card h4{ font-family:var(--font-display); font-size:14px; margin-bottom:14px; color:var(--text-0);}
.chart-card canvas{ max-height:240px; }

/* ---------- table ---------- */
.table-tools{ display:flex; gap:10px; margin:18px 0; flex-wrap:wrap;}
.table-tools input, .table-tools select{ background:var(--bg-1); border:1px solid var(--panel-border); border-radius:10px; padding:9px 12px; color:var(--text-0); font-size:13px; font-family:var(--font-body);}
.table-wrap{ overflow:auto; border-radius:var(--radius); border:1px solid var(--panel-border); max-height:560px;}
table{ width:100%; border-collapse:collapse; font-size:12.5px; }
thead th{ position:sticky; top:0; background:var(--bg-1); text-align:left; padding:11px 14px; color:var(--text-1); font-weight:600; border-bottom:1px solid var(--panel-border); white-space:nowrap;}
tbody td{ padding:10px 14px; border-bottom:1px solid var(--panel-border); color:var(--text-0); white-space:nowrap; font-family:var(--font-mono); font-size:12px;}
tbody tr:hover{ background:var(--panel); }
.badge{ padding:3px 9px; border-radius:8px; font-size:11px; font-weight:600; font-family:var(--font-body); }
.table-footer{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; color:var(--text-1); font-size:12.5px;}

/* ---------- dashboard ---------- */
.metric-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:18px;}
.ring-card{ padding:20px; display:flex; align-items:center; gap:14px;}
.ring-card svg{ flex-shrink:0; }
.ring-card .rtitle{ font-size:12.5px; color:var(--text-1); }
.ring-card .rval{ font-family:var(--font-display); font-size:22px; font-weight:700; }
.cm-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; max-width:280px; margin-top:14px;}
.cm-cell{ padding:16px; border-radius:10px; text-align:center; font-family:var(--font-mono);}
.cm-cell .n{ font-size:20px; font-weight:700; } .cm-cell .l{ font-size:10px; color:var(--text-2); margin-top:4px;}

/* ---------- weather ---------- */
.weather-hero{ padding:30px; display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:center;}
.weather-big{ font-family:var(--font-display); font-size:64px; font-weight:700; }
.forecast-row{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;}
.fday{ flex:1; min-width:80px; padding:14px 10px; text-align:center; border-radius:12px; background:var(--bg-1); border:1px solid var(--panel-border);}
.fday .d{ font-size:11px; color:var(--text-1); margin-bottom:6px;}
.fday .t{ font-family:var(--font-mono); font-size:14px;}

/* ---------- alerts page ---------- */
.alert-level-card{ padding:30px; text-align:center; }
.level-badge{ display:inline-flex; align-items:center; gap:10px; padding:10px 22px; border-radius:30px; font-family:var(--font-display); font-weight:700; font-size:15px; margin:14px 0;}
.tip-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px;}
.tip-card{ padding:18px; }
.sos-btn{ width:120px; height:120px; border-radius:50%; margin:20px auto; display:grid; place-items:center; cursor:pointer;
  background:radial-gradient(circle at 35% 30%, #ff7a8f, var(--red)); box-shadow:0 0 0 0 rgba(255,77,106,.6); animation:sos 1.8s infinite; font-family:var(--font-display); font-weight:700; color:#fff; font-size:18px; border:none;}
@keyframes sos{ 0%{box-shadow:0 0 0 0 rgba(255,77,106,.55);} 70%{box-shadow:0 0 0 26px rgba(255,77,106,0);} 100%{box-shadow:0 0 0 0 rgba(255,77,106,0);} }

/* ---------- footer / contact ---------- */
footer{ margin-top:80px; padding:40px 24px; border-top:1px solid var(--panel-border); }
.footer-grid{ max-width:1280px; margin:0 auto; display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:40px;}
.foot-badges{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.foot-badges span{ font-family:var(--font-mono); font-size:11px; padding:5px 10px; border-radius:8px; background:var(--panel); border:1px solid var(--panel-border); color:var(--text-1);}
.contact-form{ display:flex; flex-direction:column; gap:12px; margin-top:10px; width:100%; }

/* Universal High-Precision Text Field & Form UI System */
input[type="text"],
input[type="email"],
input[type="password"],
input[type="number"],
input[type="search"],
input[type="tel"],
input[type="url"],
input:not([type]),
textarea,
select,
.contact-form input,
.contact-form textarea {
  background: rgba(11, 26, 38, 0.82) !important;
  border: 1px solid rgba(190, 226, 244, 0.24) !important;
  border-radius: 12px !important;
  padding: 12px 16px !important;
  color: var(--text-0, #f1f7fb) !important;
  font-family: var(--font-body, 'Inter', sans-serif) !important;
  font-size: 13.5px !important;
  backdrop-filter: blur(14px) !important;
  -webkit-backdrop-filter: blur(14px) !important;
  box-shadow: 0 4px 14px -2px rgba(0, 10, 20, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1) !important;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
  width: 100% !important;
  box-sizing: border-box !important;
}

textarea,
.contact-form textarea {
  min-height: 84px !important;
  resize: vertical !important;
  line-height: 1.6 !important;
}

input:focus,
textarea:focus,
select:focus,
.contact-form input:focus,
.contact-form textarea:focus {
  outline: none !important;
  border-color: var(--cyber, #33C7FF) !important;
  box-shadow: 0 0 0 3px rgba(51, 199, 255, 0.32), 0 0 22px rgba(51, 199, 255, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.18) !important;
  background: rgba(18, 44, 66, 0.94) !important;
  color: #ffffff !important;
}

input::placeholder,
textarea::placeholder,
.contact-form input::placeholder,
.contact-form textarea::placeholder {
  color: var(--text-2, #6b8299) !important;
  opacity: 0.85 !important;
}

html.light input[type="text"],
html.light input[type="email"],
html.light input[type="password"],
html.light input[type="number"],
html.light input[type="search"],
html.light input[type="tel"],
html.light input:not([type]),
html.light textarea,
html.light select,
html.light .contact-form input,
html.light .contact-form textarea {
  background: rgba(255, 255, 255, 0.94) !important;
  border-color: rgba(140, 175, 205, 0.42) !important;
  color: #091726 !important;
  box-shadow: 0 2px 8px rgba(0, 30, 60, 0.06) !important;
}

html.light input:focus,
html.light textarea:focus,
html.light select:focus,
html.light .contact-form input:focus,
html.light .contact-form textarea:focus {
  background: #ffffff !important;
  border-color: #0284c7 !important;
  box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25), 0 0 16px rgba(2, 132, 199, 0.15) !important;
}

.toast{ position:fixed; bottom:24px; right:24px; padding:14px 20px; border-radius:12px; background:var(--bg-1); border:1px solid var(--cyber); color:var(--text-0); font-size:13px; box-shadow:0 10px 40px -10px rgba(0,0,0,.5); z-index:999; opacity:0; transform:translateY(10px); transition:.3s; font-family:var(--font-body);}
.toast.show{ opacity:1; transform:translateY(0); }

/* ---------- Skeletons & Component Loading States ---------- */
.skeleton{
  background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s infinite;
  border-radius: 8px;
}
html.light .skeleton{
  background: linear-gradient(90deg, rgba(10,20,45,0.04) 25%, rgba(10,20,45,0.09) 50%, rgba(10,20,45,0.04) 75%);
  background-size: 200% 100%;
}
@keyframes shimmer{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }

.skeleton-box{ height:120px; width:100%; margin-bottom:12px; border-radius:12px; }
.skeleton-line{ height:14px; width:80%; margin-bottom:10px; border-radius:6px; }
.skeleton-line.short{ width:45%; }
.skeleton-line.xs{ height:10px; width:30%; margin-bottom:6px; }

/* Dedicated Component-Level Skeletons */
.skeleton-card-wrap{
  padding: 22px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  overflow: hidden;
}
.skeleton-chart-wrap{
  padding: 22px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--panel-border);
  min-height: 280px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.skeleton-chart-bars{
  display: flex;
  align-items: flex-end;
  gap: 12px;
  height: 180px;
  padding: 10px 0;
  border-bottom: 1px solid var(--panel-border);
}
.skeleton-chart-bar{
  flex: 1;
  border-radius: 4px 4px 0 0;
}
.skeleton-table-wrap{
  width: 100%;
  overflow-x: auto;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--panel-border);
  padding: 16px;
}
.skeleton-table-row{
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr 1.2fr 1fr;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.skeleton-map-wrap{
  min-height: 380px;
  border-radius: var(--radius);
  background: radial-gradient(circle at center, rgba(51,199,255,0.06), transparent 70%), var(--bg-1);
  border: 1px solid var(--panel-border);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Component State Containers */
.component-state-empty{
  padding: 36px 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.component-state-error{
  padding: 24px;
  border-radius: 12px;
  background: rgba(255, 77, 106, 0.08);
  border: 1px solid rgba(255, 77, 106, 0.3);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.data-freshness-bar{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  border-radius: 8px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--panel-border);
  font-size: 11.5px;
  color: var(--text-1);
  margin-bottom: 14px;
}
.freshness-pulse{
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ocean);
  box-shadow: 0 0 8px var(--ocean);
  display: inline-block;
  margin-right: 6px;
}
.freshness-pulse.stale{
  background: var(--amber);
  box-shadow: 0 0 8px var(--amber);
}
.btn-refresh-icon{
  background: transparent;
  border: none;
  color: var(--text-1);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s ease;
}
.btn-refresh-icon:hover{
  color: var(--cyber);
  background: rgba(51,199,255,0.1);
}
.btn-refresh-icon.spinning svg, .btn-refresh-icon.spinning span{
  animation: spin 0.8s linear infinite;
}
@keyframes spin{ 100%{ transform: rotate(360deg); } }

/* Revalidation / Refreshing indicator line on top of card */
.refreshing-card{
  position: relative;
}
.refreshing-card::after{
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyber), var(--ocean), transparent);
  animation: sweep 1.5s linear infinite;
  z-index: 5;
}
@keyframes sweep{ 0%{ transform: translateX(-100%); } 100%{ transform: translateX(100%); } }

/* Inline Spinner for buttons and compact loaders */
.spinner{
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
  vertical-align: middle;
}

/* ---------- Modal System (Auth & Preferences) ---------- */
.modal-overlay{
  position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(4,9,18,0.85); backdrop-filter:blur(8px);
  z-index:200; display:none; place-items:center; padding:20px; animation:fadeIn .25s ease;
}
.modal-overlay.open{ display:grid; }
.modal-card{
  background:var(--bg-1); border:1px solid var(--panel-border); border-radius:20px; width:100%; max-width:480px;
  padding:32px; box-shadow:0 24px 70px -15px rgba(0,0,0,0.8); position:relative; animation:scaleUp .3s ease;
}
.modal-card.modal-lg{ max-width: 640px; max-height: 90vh; overflow-y: auto; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes scaleUp{ from{transform:scale(0.95); opacity:0;} to{transform:scale(1); opacity:1;} }
.modal-close{ position:absolute; top:20px; right:20px; background:transparent; border:none; color:var(--text-1); cursor:pointer; font-size:18px; }
.modal-close:hover{ color:var(--text-0); }
.auth-tabs{ display:flex; gap:10px; margin-bottom:20px; border-bottom:1px solid var(--panel-border); padding-bottom:12px; }
.auth-tab-btn{ background:transparent; border:none; font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--text-1); cursor:pointer; padding:6px 12px; border-radius:8px; }
.auth-tab-btn.active{ color:var(--cyber); background:rgba(51,199,255,0.1); }

/* ---------- Permission Center Styles ---------- */
.perm-meter-track{
  height: 8px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; margin: 12px 0 18px; position: relative;
}
.perm-meter-bar{
  height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--cyber), var(--ocean)); transition: width 0.4s ease;
}
.perm-grid{
  display: flex; flex-direction: column; gap: 12px; margin-top: 16px;
}
.perm-item{
  padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.025);
  border: 1px solid var(--panel-border); transition: all 0.2s ease;
  display: flex; flex-direction: column; gap: 10px;
}
.perm-item:hover{
  background: rgba(255,255,255,0.045); border-color: rgba(51, 199, 255, 0.3);
}
.perm-item-header{
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.perm-item-title{
  display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px;
}
.perm-item-desc{
  font-size: 12px; color: var(--text-1); line-height: 1.5; margin-left: 28px;
}
.perm-item-actions{
  display: flex; align-items: center; justify-content: space-between; margin-left: 28px; padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.05); gap: 12px; flex-wrap: wrap;
}
.perm-prompt-banner{
  padding: 14px 20px; margin-bottom: 24px; border-radius: 14px;
  border: 1px solid rgba(51, 199, 255, 0.28);
  background: linear-gradient(90deg, rgba(51, 199, 255, 0.08) 0%, rgba(31, 224, 168, 0.08) 100%);
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.perm-status-btn{
  font-family: var(--font-mono); font-size: 11px; padding: 6px 12px; border-radius: 8px;
  display: inline-flex; align-items: center; gap: 6px;
}

/* ---------- Scroll-Driven Storytelling (Scrolltelling) ---------- */
/* ---------- Scroll-Driven Storytelling (Scrolltelling) ---------- */
.scrolltelling-container{
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 52px;
  position: relative;
  margin: 50px 0;
  align-items: stretch; /* Critical: allows column 2 to span full height of narrative */
}
.scrolltelling-narrative{
  display: flex;
  flex-direction: column;
  gap: 110px;
  padding: 10px 0 140px;
}
.story-step{
  padding: 32px 34px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid var(--panel-border);
  transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.35s ease, background 0.35s ease, box-shadow 0.35s ease;
  opacity: 0.38;
  transform: scale(0.975);
  position: relative;
}
.story-step::before{
  content: '';
  position: absolute;
  left: -2px; top: 22px; bottom: 22px; width: 4px;
  border-radius: 4px;
  background: transparent;
  transition: background 0.3s ease, box-shadow 0.3s ease;
}
.story-step.active{
  opacity: 1;
  transform: scale(1);
  border-color: rgba(51, 199, 255, 0.5);
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.045) 0%, rgba(51, 199, 255, 0.035) 100%);
  box-shadow: 0 20px 48px -12px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
}
.story-step.active::before{
  background: linear-gradient(180deg, var(--cyber), var(--ocean));
  box-shadow: 0 0 16px rgba(51, 199, 255, 0.65);
}
.story-step-badge{
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--cyber);
  text-transform: uppercase;
  margin-bottom: 8px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.story-step h3{
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  margin: 4px 0 12px;
  color: var(--text-0);
  line-height: 1.25;
}
.story-step p{
  font-size: 14px;
  color: var(--text-1);
  line-height: 1.7;
  margin-bottom: 14px;
}
.story-step-highlight{
  padding: 12px 16px;
  border-radius: 12px;
  background: rgba(0,0,0,0.28);
  border: 1px solid var(--panel-border);
  font-size: 12.5px;
  color: var(--text-0);
  line-height: 1.55;
}
.story-step .mobile-scene{
  display: none;
}

.scrolltelling-stage{
  position: -webkit-sticky;
  position: sticky;
  top: 96px;
  align-self: start;
  height: 590px;
  border-radius: 24px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: stretch;
  border: 1px solid rgba(51, 199, 255, 0.3);
  background: radial-gradient(ellipse at 50% 15%, rgba(13, 27, 56, 0.96), rgba(4, 8, 18, 0.99));
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(51, 199, 255, 0.12), inset 0 1px 2px rgba(255, 255, 255, 0.2);
  z-index: 10;
}
html.light .scrolltelling-stage{
  background: radial-gradient(ellipse at 50% 15%, rgba(255, 255, 255, 0.98), rgba(235, 244, 255, 0.95));
  border-color: rgba(51, 199, 255, 0.4);
  box-shadow: 0 30px 80px -15px rgba(10, 20, 45, 0.2), 0 0 40px rgba(51, 199, 255, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.8);
}

/* IMAX HUD Header Bar */
.imax-hud-bar{
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 18px;
  background: rgba(0, 0, 0, 0.45);
  border-bottom: 1px solid rgba(51, 199, 255, 0.2);
  z-index: 20;
  position: relative;
  backdrop-filter: blur(10px);
}
html.light .imax-hud-bar{
  background: rgba(255, 255, 255, 0.7);
  border-bottom-color: rgba(51, 199, 255, 0.25);
}

.imax-timeline-nav{
  display: flex;
  gap: 5px;
  align-items: center;
}

.imax-nav-pill{
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.25s ease;
  user-select: none;
}
.imax-nav-pill:hover{
  background: rgba(51, 199, 255, 0.12);
  color: var(--cyber);
  border-color: rgba(51, 199, 255, 0.3);
}
.imax-nav-pill.active{
  background: rgba(51, 199, 255, 0.2);
  border-color: var(--cyber);
  color: #FFFFFF;
  box-shadow: 0 0 10px rgba(51, 199, 255, 0.4);
}

.imax-progress-track{
  height: 2px;
  width: 100%;
  background: rgba(255, 255, 255, 0.08);
  position: relative;
  overflow: hidden;
  z-index: 20;
}
.imax-progress-fill{
  height: 100%;
  width: 16.66%;
  background: linear-gradient(90deg, var(--cyber), var(--ocean));
  box-shadow: 0 0 8px var(--cyber);
  transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Animations */
@keyframes imaxRadarSweep {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes imaxRadarPing {
  0% { transform: scale(0.6); opacity: 1; }
  100% { transform: scale(2.8); opacity: 0; }
}
@keyframes imaxPulseGlow {
  0%, 100% { opacity: 0.35; transform: scale(0.98); }
  50% { opacity: 0.85; transform: scale(1.02); }
}
@keyframes imaxSignalExpand {
  0% { transform: scale(0.85); opacity: 0.9; }
  100% { transform: scale(1.6); opacity: 0; }
}

.stage-scene{
  position: absolute;
  top: 48px;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 18px 24px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: stretch;
  opacity: 0;
  pointer-events: none;
  transform: translateY(16px) scale(0.98);
  transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}
.stage-scene.active{
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.scene-header{
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--cyber);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.scene-header::before{
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyber);
  box-shadow: 0 0 8px var(--cyber);
}

.scene-footer-pill{
  margin-top: 18px;
  padding: 10px 16px;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 12px;
  text-align: center;
  color: var(--text-1);
}
html.light .scene-footer-pill{
  background: rgba(255, 255, 255, 0.85);
  border-color: rgba(10, 20, 45, 0.1);
  color: var(--text-0);
}

@media (max-width: 980px){
  .scrolltelling-container{
    grid-template-columns: 1fr;
    gap: 28px;
  }
  .scrolltelling-stage{
    display: none;
  }
  .story-step{
    opacity: 1;
    transform: none;
  }
  .story-step .mobile-scene{
    display: block;
    margin-top: 18px;
    padding: 20px;
    border-radius: 16px;
    background: radial-gradient(ellipse at 50% 25%, rgba(14, 25, 48, 0.94), rgba(6, 11, 24, 0.98));
    border: 1px solid rgba(51, 199, 255, 0.22);
  }
}

@media (prefers-reduced-motion: reduce){
  .story-step{ transition: none !important; transform: none !important; opacity: 1 !important; }
  .stage-scene{ transition: none !important; transform: none !important; }
}

/* ---------- SHAP Explainability Waterfall Rows ---------- */
.shap-container{ margin-top:18px; }
.shap-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12px; }
.shap-fname{ width:130px; color:var(--text-1); font-family:var(--font-mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.shap-bar-track{ flex:1; height:8px; border-radius:4px; background:rgba(255,255,255,0.06); position:relative; overflow:hidden; }
.shap-bar-fill{ height:100%; border-radius:4px; transition:width .4s ease; }
.shap-bar-pos{ background:linear-gradient(90deg, #FFB84D, #FF4D6A); }
.shap-bar-neg{ background:linear-gradient(90deg, #1FE0A8, #33C7FF); }
.shap-score{ width:50px; text-align:right; font-family:var(--font-mono); font-weight:600; }

/* ---------- Threat Intelligence Synthesis Box ---------- */
.threat-intel-box{
  margin-top:20px; padding:22px; border-radius:14px; background:linear-gradient(135deg, rgba(51,199,255,0.06), rgba(177,140,255,0.04));
  border:1px solid rgba(51,199,255,0.25);
}
.threat-intel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
.intel-badge{ font-family:var(--font-mono); font-size:11px; padding:4px 10px; border-radius:6px; background:rgba(51,199,255,0.15); color:var(--cyber); border:1px solid rgba(51,199,255,0.3); }
.directive-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.directive-item{ display:flex; align-items:flex-start; gap:10px; font-size:12.5px; line-height:1.5; color:var(--text-0); }
.directive-icon{ color:var(--ocean); flex-shrink:0; margin-top:2px; }

/* ---------- Map Layer Control & Freshness ---------- */
.layer-toggle-btn{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-radius:10px; background:var(--bg-1); border:1px solid var(--panel-border); font-size:12.5px; cursor:pointer; margin-bottom:8px; color:var(--text-1); transition:.2s;}
.layer-toggle-btn.active{ border-color:var(--cyber); color:var(--text-0); background:rgba(51,199,255,0.08); }
.layer-slider{ width:100%; accent-color:var(--cyber); margin-top:6px; }

/* ---------- Liquid Glass UI & User Separation Styles ---------- */
.liquid-glass{
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.015) 100%), rgba(6, 11, 24, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border-radius: var(--radius);
  box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px 0 rgba(255, 255, 255, 0.18);
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.liquid-glass::before{
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(51, 199, 255, 0.5), rgba(31, 224, 168, 0.5), transparent);
}
.liquid-glass:hover{
  border-color: rgba(51, 199, 255, 0.35);
  box-shadow: 0 20px 48px -10px rgba(51, 199, 255, 0.22), inset 0 1px 2px 0 rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}
html.light .liquid-glass{
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(245, 248, 255, 0.6) 100%);
  border: 1px solid rgba(255, 255, 255, 0.7);
  box-shadow: 0 14px 34px -10px rgba(100, 130, 180, 0.18), inset 0 1px 2px rgba(255, 255, 255, 0.9);
}

.persona-card{
  padding: 26px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
}
.persona-badge{
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  align-self: flex-start;
  margin-bottom: 12px;
}

.cmd-table{
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 14px;
}
.cmd-table th{
  text-align: left;
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-2);
  border-bottom: 1px solid var(--panel-border);
}
.cmd-table td{
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  color: var(--text-0);
}
.cmd-table tr:hover td{
  background: rgba(51, 199, 255, 0.04);
}

/* ---------- Accessibility / Reduced Motion ---------- */
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  .radar-scan{ animation:none !important; }
  .alert-dot{ animation:none !important; }
  .sos-btn{ animation:none !important; }
}

@media (max-width: 980px){
  nav.tabs{ display:none; }
  .hero{ grid-template-columns:1fr; }
  .stat-strip{ grid-template-columns:repeat(2,1fr); }
  .grid-cards{ grid-template-columns:repeat(2,1fr); }
  .predict-layout, .map-layout, .chart-grid, .metric-grid, .story-grid{ grid-template-columns:1fr; }
  .footer-grid{ grid-template-columns:1fr; }
  .form-grid{ grid-template-columns:1fr; }
}

.dist-label{ background:rgba(6,11,24,.75); color:#fff; border:none; box-shadow:none; font-size:11px; font-weight:600; padding:2px 6px; border-radius:6px; }
.dist-label:before{ display:none; }
/* ---------- map fallback + alert sound ---------- */
#map{ background:#0b1730; z-index:0; }
html.light #map{ background:#dfe9f5; }
.leaflet-container{ font-family:var(--font-body); }
.map-note{ display:none; margin-top:10px; padding:10px 12px; border-radius:10px; font-size:12px; line-height:1.5; color:var(--text-1); border:1px dashed var(--panel-border); }
.map-note.show{ display:block; }
.sound-card{ padding:24px; margin-top:24px; }
.sound-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px; }
.sound-grid .btn{ padding:12px 10px; font-size:13px; }
.sound-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:16px; font-size:13px; color:var(--text-1); }
.sound-row input[type=range]{ width:180px; accent-color:var(--cyber); }
.siren-live{ display:none; margin:6px auto 0; font-family:var(--font-mono); font-size:12px; letter-spacing:1.5px; color:var(--red); }
.siren-live.on{ display:block; animation:pulse 1s infinite; }
.sos-btn.sounding{ animation:sos .6s infinite; }
@media (max-width:900px){ .sound-grid{ grid-template-columns:repeat(2,1fr);} }
</style>
</head>
