name: FloodAI Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend & API Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Execute Automated Test Verification
        run: |
          node test_climate_engine.js
          node test_climate_backgrounds.js
          node test_light_theme_particles.js
          node test_responsive_role_nav.js

  ml-service-lint:
    name: Python ML Service Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ml_model/requirements.txt ]; then pip install -r ml_model/requirements.txt; fi

      - name: Verify ML Prediction Module Compilation
        run: |
          python -m py_compile ml_model/predict_api.py ml_model/config.py
